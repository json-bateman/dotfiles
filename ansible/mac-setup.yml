- hosts: localhost
  gather_facts: false
  become: false

  vars:
    user: "{{ lookup('env', 'USER') }}"
    home: "/Users/{{ user }}"
    dotfiles_dir: "{{ home }}/dotfiles"

  tasks:

    - name: Check if Homebrew is installed
      stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check

    - name: Install Homebrew if not present (Apple Silicon)
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        executable: /bin/bash
      when: not homebrew_check.stat.exists
      tags: [homebrew]

    - name: Install core CLI packages with Homebrew
      community.general.homebrew:
        name:
          - git
          - node
          - go
          - neovim
          - tree
          - wget
          - autojump
          - tmux
          - zsh
          - gcc
          - clang
          - g++
          - ripgrep
          - fzf
          - vim
          - zsh-syntax-highlighting
          - zsh-autosuggestions
          - lazygit
        state: present
      tags: [soy, homebrew]

    - name: Install yarn globally
      npm:
        name: yarn
        global: yes
        executable: npm
      tags: [node, yarn]

    - name: Install oh-my-zsh (user mode, non-interactive)
      shell: |
        export RUNZSH=no
        export CHSH=no
        if [ ! -d "$HOME/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
        fi
      args:
        executable: /bin/bash
      tags: [zsh]

    - name: Install mise-en-place
      shell: |
        curl https://mise.run | sh
      tags: [devtools, mise]

    - name: Create folders
      file:
        path: "{{ item | expanduser }}"
        state: directory
        mode: '0755'
        owner: "{{ user }}"
        group: "{{ user }}"
      loop:
        - ~/.cache
        - ~/coding
        - ~/.config
      tags: [dotfiles]

    - name: Symlink top-level dotfiles
      file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ home }}/{{ item.dest }}"
        state: link
        force: true
        owner: "{{ user }}"
        group: "{{ user }}"
      loop:
        - { src: ".wezterm.lua", dest: ".wezterm.lua" }
        - { src: ".vimrc", dest: ".vimrc" }
        - { src: ".gitconfig", dest: ".gitconfig" }
        - { src: ".tmux.conf", dest: ".tmux.conf" }
        - { src: "zsh/linux-zshrc", dest: ".zshrc" }
      tags: [dotfiles]

    - name: Symlink Neovim config
      file:
        src: "{{ dotfiles_dir }}/nvim"
        dest: "{{ home }}/.config/nvim"
        state: link
        force: true
        owner: "{{ user }}"
        group: "{{ user }}"
      tags: [nvim, dotfiles]

    - name: Change default shell to zsh for user - {{ user }}
      user:
        name: "{{ user }}"
        shell: /bin/zsh
      tags: [zsh]

    - name: Install Homebrew Cask apps
      community.general.homebrew_cask:
        name:
          - wezterm
          - spotify
          - google-chrome
          - telegram
          - docker
        state: present
      tags: [cask, apps]

