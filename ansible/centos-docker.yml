---

- name: Install Docker on CentOS Stream 10
  hosts: localhost
  become: true # Run tasks with sudo, use ansible-playbook <play> -K

  vars:
    user: "{{ lookup('env', 'USER') }}" # Finds user on current machine
    users:
      - "{{ user }}"
      # Add more if desired 

  tasks:
    - name: Ensure dnf-utils is installed
      dnf:
        name: dnf-utils
        state: present

    - name: Add Docker repository
      shell: |
        dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    # Ensure docker group exists, add users, and verify
    - name: Ensure docker group exists
      become: true
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add users to docker group
      become: true
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ users }}"

    # --- Verification & helpful hints ---

    - name: Show docker group members (system source of truth)
      become: true
      ansible.builtin.command: getent group docker
      register: docker_group_entry
      changed_when: false

    - name: Verify Docker installation
      command: docker run hello-world
      register: docker_hello_world_output
      changed_when: false # This command is for verification, not a state change
      ignore_errors: true # In case the image is not found initially

    - name: Display Docker verification result
      debug:
        var: docker_hello_world_output.stdout_lines
      when: docker_hello_world_output.stdout is defined

    - name: Print reminder about docker group
      ansible.builtin.debug:
        msg: >
          🐋 Docker installed successfully! 🐋
          If you just added yourself to the `docker` group,
          run `newgrp docker` to login to it in the current session.

