- hosts: localhost
  connection: local
  gather_facts: false # Don't need any system facts (OS info, IP addresses etc.)
  become: false

  vars:
    user: "{{lookup('env', 'USER') }}"
    home: "/home/{{ user }}"
    dotfiles_dir: "{{ home }}/dotfiles"
  tasks:

    - name: Install common packages
      become: true # becomes sudo user for admin tasks (i.e. installing)
      package:
        name:
          - golang
          - nodejs
          - neovim
          - tree
          - wget
          - autojump
          - tmux
          - zsh
          - gcc
          - clang
          - g++
          - ripgrep
          - fzf
          - vim
          - zsh-syntax-highlighting
          - zsh-autosuggestions
        state: present
      tags: [soy]

    - name: Install oh-my-zsh (user mode, non-interactive)
      shell: | # Install oh-my-zsh but don't change shell
        export RUNZSH=no
        export CHSH=no
        if [ ! -d "$HOME/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
        fi
      args:
        executable: /bin/bash
      tags: [zsh]

    - name: Install mise-en-place # Dev environment setup tool for multiple languages
      shell: |
        curl https://mise.run | sh
      tags: [devtools, mise]

    - name: Create folders
      file:
        path: "{{ item | expanduser }}" # expanduser turns ~ into /home/jack
        state: directory
        mode: '0755'
      loop:
        - ~/.cache
        - ~/coding
        - ~/.config
      tags: [dotfiles]

    - name: Symlink top-level dotfiles
      file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ home }}/{{ item.dest }}"
        state: link
        force: true
      loop:
        - { src: ".wezterm.lua", dest: ".wezterm.lua" }
        - { src: ".vimrc", dest: ".vimrc" }
        - { src: ".gitconfig", dest: ".gitconfig" }
        - { src: ".tmux.conf", dest: ".tmux.conf" }
        - { src: "zsh/linux-zshrc", dest: ".zshrc" }
      tags: [dotfiles]

    - name: Symlink Neovim config
      file:
        src: "{{ dotfiles_dir }}/nvim"
        dest: "{{ home }}/.config/nvim"
        state: link
        force: true
      tags: [nvim, dotfiles]

    - name: Update locate database
      become: true
      command: updatedb
      tags: [locate]

    - name: Change default shell to zsh for user - {{ user }}
      become: true
      user:
        name: "{{ user }}"
        shell: /bin/zsh
      tags: [zsh]

    - name: Install yarn
      become: true
      npm:
        name: yarn
        global: yes
        executable: npm
      tags: [node, yarn]

    - name: Add lazygit and wezterm COPR repository
      become: true
      command: dnf copr enable -y {{ item }}
      loop:
        - dejan/lazygit
        - wezfurlong/wezterm-nightly
      tags: [copr]

    - name: Install copr packages 
      become: true
      package:
        name: 
          - lazygit 
          - wezterm 
        state: present
      tags: [wezterm]
