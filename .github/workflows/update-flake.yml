name: Update flake.lock

on:
  schedule:
    # Weekly, Mondays 04:00 UTC. The basement box's system.autoUpgrade runs at
    # 04:00 America/New_York (08:00 UTC), so it picks this up the same morning.
    - cron: "0 4 * * 1"
  workflow_dispatch:        # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write           # let the default GITHUB_TOKEN push the commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: nix flake update --flake ./nix

      - name: Commit and push if the lock changed
        run: |
          if ! git diff --quiet -- nix/flake.lock; then
            git config user.name  "flake-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "flake.lock: automated update"
            git push
          else
            echo "No input updates this week."
          fi
